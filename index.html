<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPP — Tüm fırsatlar tek uygulamada</title>
<meta name="description" content="OPP, bankaların ve markaların kampanyalarını tek bir uygulamada toplar.">
<style>
  :root{--bg:#FAF7F2;--card:#fff;--ink:#241C17;--muted:#6B625A;--brand:#C6413A;--line:#E7E0D6}
  @media (prefers-color-scheme:dark){:root{--bg:#17130F;--card:#201A15;--ink:#F3EDE5;--muted:#A99E92;--line:#33291F}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh}
  .wrap{max-width:560px;padding:40px 22px;text-align:center}
  .logo{font-weight:800;font-size:44px;color:var(--brand);letter-spacing:1px;margin-bottom:6px}
  .tag{font-size:19px;font-weight:600;margin-bottom:8px}
  p{color:var(--muted);margin:0 auto 26px;max-width:44ch}
  .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
  .links a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
           padding:13px 20px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
  .links a:hover{border-color:var(--brand);color:var(--brand)}
  .mail{color:var(--muted);font-size:14px}
  .mail a{color:var(--brand)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">opp</div>
    <div class="tag">Tüm fırsatlar tek uygulamada</div>
    <p>Bankaların, operatörlerin ve markaların kampanyalarını tek yerde topluyoruz —
       hiçbirini kaçırmayın.</p>
    <div class="links">
      <a href="privacy/">Gizlilik Politikası</a>
      <a href="terms/">Kullanım Koşulları</a>
    </div>
    <div class="mail">İletişim: <a href="mailto:oppdeveloper@gmail.com">oppdeveloper@gmail.com</a></div>
  </div>
</body>
</html>
